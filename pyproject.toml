[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CoChem-GEOM"
version = "0.2.0"
description = "FTMW rotational spectroscopy geometry fitting (weighted r0, honest Kraitchman rs) and converged CCSD equilibrium structure comparison for the CoChem ecosystem."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Dr. Joshua John Klaassen" },
    { name = "CoChem Team" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.4",
    "pandas>=2.0",
    "networkx>=3.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
]
pyscf = [
    "pyscf>=2.6",
    "geometric>=1.0",
]
ui = [
    "streamlit>=1.37",
    "matplotlib>=3.8",
]

[project.scripts]
cochem-geom = "cochem_geom.cli:main"

[project.entry-points."cochem.modules"]
geom = "cochem_geom.provider:geom_provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cochem_geom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
